<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HASHIM MI V30</title><style>body{font-family:Arial;background:#0b1020;color:#eee;margin:0;padding:20px}h1{margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#151d33;border:1px solid #2b3655;border-radius:14px;padding:15px}.score{font-size:28px;font-weight:bold}.long{color:#49e28a}.short{color:#ff6578}.muted{color:#9ba7c1}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #29324b;text-align:right}</style></head><body><h1>🧠 HASHIM MARKET INTELLIGENCE V30</h1><div id="status" class="muted">جارٍ التحميل...</div><div id="cards" class="grid"></div><script>async function load(){let h=await fetch('/api/health').then(x=>x.json());document.getElementById('status').textContent='النظام: متصل | '+h.utc;let a=await fetch('/api/opportunities?limit=30').then(x=>x.json());document.getElementById('cards').innerHTML=a.map(x=>`<div class="card"><h2>${x.symbol}</h2><div class="score ${x.score>0?'long':'short'}">${x.score}</div><b>${x.label}</b><p class="muted">السعر: ${x.price??'-'}</p><p>${(x.reasons||[]).join(' • ')}</p></div>`).join('')||'<div class="card">لا توجد إشارات مسجلة بعد.</div>'}load();setInterval(load,10000)</script></body></html>
